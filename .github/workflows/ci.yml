name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # Manual run. Set push_image to push the built image to Harbor without cutting
  # a release. This is how test instances get an image to deploy.
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the built image to Harbor'
        type: boolean
        default: false
      image_tag:
        description: 'Tag for the pushed image (default: branch name and sha-<short sha>)'
        type: string
        default: ''
  # Allows release.yml to gate a release on the same checks. No inputs are
  # declared here, so inputs.push_image is empty and the image is never pushed
  # from the release path. release.yml pushes the tagged image itself.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install hatch
        run: pip install hatch

      # Runs ruff (pinned in [tool.hatch.envs.hatch-static-analysis]) in check-only mode.
      - name: Check formatting and lint
        run: hatch fmt --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The Si fixtures run real pm-muairss/pm-uep-opt jobs; the suite takes ~6 min locally.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          pip install --upgrade pip
          pip install -e '.[testing]'

      # The CalcJob submit scripts invoke these by name, so they must resolve on PATH.
      - name: Check pymuon-suite executables are on PATH
        run: |
          which pm-muairss
          which pm-uep-opt

      # aiida-core >= 2.6 defaults the test profile to core.sqlite_dos with no
      # broker, so no PostgreSQL or RabbitMQ service is needed here.
      - name: Run tests
        run: pytest -v --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hatch
        run: pip install hatch

      - name: Build sdist and wheel
        run: hatch build

      # Confirms the wheel installs standalone and the AiiDA entry points register.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "
          from aiida.plugins import CalculationFactory, DataFactory, WorkflowFactory
          CalculationFactory('pymuon.muairss')
          CalculationFactory('pymuon.uep_opt')
          DataFactory('pymuon.uep')
          WorkflowFactory('pymuon.muairss_uep')
          print('entry points OK')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never push an image that failed its own checks.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Derive image tags
        if: ${{ inputs.push_image }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.HARBOR_URL }}/aiida-pymuon-suite
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=ref,event=branch,enable=${{ inputs.image_tag == '' }}
            type=sha,format=short,enable=${{ inputs.image_tag == '' }}
          # These are test-instance images; never let one claim `latest`.
          flavor: latest=false

      # On a pull request or a normal push this only builds -- the in-Dockerfile
      # checks (entry points, pm-muairss, pm-uep-opt) are the point. A manual run
      # with push_image set also pushes the result to Harbor.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push_image == true }}
          tags: ${{ inputs.push_image && steps.meta.outputs.tags || 'aiida-pymuon-suite:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report pushed tags
        if: ${{ inputs.push_image }}
        # image_tag is user-supplied, so it reaches the shell via env rather than
        # being interpolated into the script text.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Image pushed to Harbor'
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
