name: Release

# Triggered by pushing an annotated tag, e.g.:
#   git tag -a v0.1.0 -m 'v0.1.0' && git push origin v0.1.0
# The tag must match __version__ in src/aiida_pymuon_suite/__init__.py.
on:
  push:
    tags: ['v*']
  # Manual re-run. Pick the tag to release under "Use workflow from" -- that
  # dropdown lists tags as well as branches -- and untick whichever half you
  # do not want to repeat.
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Create/update the GitHub release'
        type: boolean
        default: true
      push_image:
        description: 'Build and push the image to Harbor'
        type: boolean
        default: true

jobs:

  # Re-run the full CI suite against the tagged commit before publishing anything.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  github-release:
    name: Publish GitHub release
    needs: [checks]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_github_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A manual run can be pointed at a branch by mistake, where there is no
      # version to release and `gh release create` would fail confusingly.
      - name: Require a tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run from a v* tag; ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hatch
        run: pip install hatch

      - name: Check tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(hatch version)"
          echo "tag=${tag_version} package=${pkg_version}"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${pkg_version}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: hatch build

      # --verify-tag refuses to publish if the tag is missing on the remote.
      # On a manual re-run the release usually exists already, so replace its
      # assets rather than failing.
      - name: Create or update release with distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists; replacing its assets."
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi


  harbor-image:
    name: Push image to Harbor
    needs: [checks]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag types below are semver-derived, so a branch ref would produce no
      # tags at all and push nothing.
      - name: Require a tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run from a v* tag; ${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.HARBOR_URL }}/aiida-pymuon-suite
          # The default flavor is latest=auto, which already adds `latest` for a
          # real release and omits it (along with the major.minor tag) for a
          # prerelease such as v0.1.0-rc1. No explicit latest line is needed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
